<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="SimplexChat-Portable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e90ff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#ff5a36"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2540" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="glowB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- bordas -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#blue)"/>
  <rect x="0" y="354" width="1280" height="6" fill="url(#red)"/>

  <!-- ícone: balões de chat + cadeado -->
  <g transform="translate(70 70)" filter="url(#glowB)">
    <path d="M20 0h150a20 20 0 0 1 20 20v100a20 20 0 0 1-20 20H80l-40 34v-34H20a20 20 0 0 1-20-20V20A20 20 0 0 1 20 0z" fill="none" stroke="url(#blue)" stroke-width="9" stroke-linejoin="round"/>
  </g>
  <g transform="translate(120 108)" filter="url(#glowR)">
    <rect x="0" y="26" width="90" height="62" rx="10" fill="url(#red)"/>
    <path d="M18 26v-12a27 27 0 0 1 54 0v12" fill="none" stroke="url(#red)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="45" cy="55" r="8" fill="#0b1020"/>
    <rect x="41" y="58" width="8" height="18" rx="3" fill="#0b1020"/>
  </g>

  <!-- título -->
  <text x="320" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">Simplex<tspan fill="url(#blue)">Chat</tspan></text>
  <text x="320" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" fill="url(#red)" letter-spacing="-2">Portable</text>

  <!-- subtítulo -->
  <text x="320" y="305" font-family="'Courier New', Consolas, monospace" font-size="24" fill="#8fa3c8">$ ./SimplexChat-inicializador.sh<tspan fill="#00d4ff"> █</tspan></text>

  <!-- tags -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="940" y="92" width="270" height="44" rx="22" fill="none" stroke="#1e90ff" stroke-width="2.5"/>
    <text x="1075" y="122" text-anchor="middle" fill="#00d4ff">BASH · PORTÁTIL</text>

    <rect x="940" y="152" width="270" height="44" rx="22" fill="none" stroke="#ff2d55" stroke-width="2.5"/>
    <text x="1075" y="182" text-anchor="middle" fill="#ff5a6e">PRIVACIDADE · RESET</text>

    <rect x="940" y="212" width="270" height="44" rx="22" fill="none" stroke="#1e90ff" stroke-width="2.5"/>
    <text x="1075" y="242" text-anchor="middle" fill="#00d4ff">LICENÇA MIT</text>
  </g>
</svg>
